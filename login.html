<!doctype html>
<html lang="es" class="layout-wide customizer-hide" dir="ltr" data-skin="default" data-assets-path="assets/" data-template="vertical-menu-template-semi-dark" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Inicio de sesión</title>
    <link rel="shortcut icon" type="image/png" href="assets/img/favicon/icon2.png"/>
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    <link rel="stylesheet" href="assets/vendor/css/pages/page-auth.css" />
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/js/config.js"></script>
  </head>

  <body>
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <!-- Login -->
          <div class="card px-sm-6 px-0">
            <div class="card-body">
              <!-- Logo -->
              <div class="app-brand justify-content-center">
                <a href="#" class="app-brand-link gap-2">
                  <span class="app-brand-logo demo">
                    <span class="text-primary">
                      <img src="assets/img/favicon/icon2.png" alt="logo">
                    </span>
                  </span>
                </a>
              </div>
              <!-- /Logo -->
              <h4 class="mb-1">Bienvenido! 👋</h4>
              <p class="mb-6">Ingrese su cédula y clave para acceder</p>

              <form id="formLogin" onsubmit="event.preventDefault(); validar_form_login(1);">
                <div class="mb-6">
                  <label for="cedula" class="form-label">Cédula</label>
                  <input type="text" class="form-control" id="cedula" name="cedula_usuario" required />
                </div>
                <div class="mb-6">
                  <label for="clave" class="form-label">Clave</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="clave" name="clave" required />
                    <button class="btn btn-outline-secondary" type="button" id="toggleClave" aria-label="Mostrar u ocultar contraseña">
                      Mostrar
                    </button>
                  </div>
                </div>
                <div class="mb-6">
                  <button class="btn btn-primary d-grid w-100" type="submit">Entrar</button>
                </div>
              </form>

            </div>
          </div>
          <!-- /Login -->
        </div>
      </div>
    </div>

    <!-- Core JS -->
    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="controlador/js/proceso.js"></script> <!-- importante para usar microApi -->
    <script src="views/js/login.js"></script>

    <script>
       const inputCedula = document.getElementById('cedula');

inputCedula.addEventListener('input', function () {
  // Eliminar cualquier caracter que no sea número
  this.value = this.value.replace(/[^0-9]/g, '');
  // Limitar la longitud a 8 caracteres
  if (this.value.length > 8) {
    this.value = this.value.slice(0, 8);
  }
});
    </script>

    <script>
      const claveInput = document.getElementById('clave');
  const toggleBtn = document.getElementById('toggleClave');

  toggleBtn.addEventListener('click', () => {
    if (claveInput.type === 'password') {
      claveInput.type = 'text';
      toggleBtn.textContent = 'Ocultar';
    } else {
      claveInput.type = 'password';
      toggleBtn.textContent = 'Mostrar';
    }
  });
    </script>
    
  </body>
</html>
